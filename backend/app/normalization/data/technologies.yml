# Canonical technology taxonomy.
#
# Consumed by:
#   * `app/normalization/taxonomy.py` — validation + regex compilation (stage 2)
#   * `app/db/seed.py` — upserts `technologies` on startup/CLI
#   * prompts and the dashboard — human labels and categories
#
# Rules:
#   * `slug` is stable forever; renaming it means a data migration.
#   * `aliases` are matched case-insensitively on word boundaries, longest first.
#     Keep them unambiguous: no bare `go`, `c`, `r`, `rest`, `ml`-style traps.
#   * An alias may belong to exactly one technology (enforced by tests).

version: 1

technologies:
