[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-job-radar"
version = "0.1.0"
description = "Collects developer vacancies, normalizes them, scores them against a profile with an LLM, and delivers matches to Telegram."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Job Radar" }]
keywords = ["fastapi", "celery", "postgresql", "llm", "telegram", "job-search"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "celery>=5.4",
    "aiogram>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
prod = []

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
markers = [
    "integration: requires a running PostgreSQL (TEST_DATABASE_URL) and Redis (TEST_REDIS_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",   # handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # ClassVar annotations are used where it matters
    "RUF001", # ambiguous Cyrillic/Latin characters: the corpus is multilingual
    "RUF002",
    "RUF003",
    "UP046", # Pydantic generics use the explicit TypeVar form for 3.11 compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.tasks.*"]
disallow_untyped_decorators = false
