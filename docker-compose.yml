name: ai-job-radar

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-radar}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
  POSTGRES_DB: ${POSTGRES_DB:-radar}
  REDIS_URL: redis://redis:6379/0
  LOG_JSON: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app:celery_app worker
      --loglevel=INFO --concurrency=2 -Q collect,analyze,notify,default
    restart: unless-stopped

  beat:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=INFO
    restart: unless-stopped

  bot:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.bot
    restart: on-failure

volumes:
  pgdata:
  redisdata:
