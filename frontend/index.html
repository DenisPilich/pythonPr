<!doctype html>
<html lang="ru" data-theme="ultraviolet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Job Radar — matched vacancies without the noise" />
    <title>AI JOB RADAR</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("radar:theme") || "ultraviolet";
        if (localStorage.getItem("radar:crt") === "on") {
          document.documentElement.dataset.crt = "on";
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
